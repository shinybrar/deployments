name: Renovate

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for Manual Renovate Run'
        required: true
        type: string
  repository_dispatch:
    types: [renovate]

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Renovation Dispatch Event
        id: renovate-dispatch-event
        run: |
          echo "=== Renovation Dispatch Event ==="
          echo "Event: ${{ github.event_name }}"
          echo "=== End Payload ==="

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Renovate Bot GitHub Action
        uses: renovatebot/github-action@ea850436a5fe75c0925d583c7a02c60a5865461d # v43.0.20
        with:
          configurationFile: .github/renovate-config.json
          docker-cmd-file: .github/renovate-entrypoint.sh
          token: ${{ secrets.RENOVATE_TOKEN }}
